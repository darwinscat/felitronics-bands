name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The bands are sound and the texts are whole, and the gate refuses each kind of damage
        run: python3 tools/check.py --controls
